<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lean E-Commerce Platform API & Storefront</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #10b981;
      --accent-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding-bottom: 50px; }

    header {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky; top: 0; z-index: 100;
      padding: 1rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
    }

    .logo { font-size: 1.4rem; font-weight: 700; background: linear-gradient(to right, #818cf8, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-actions { display: flex; gap: 1rem; align-items: center; }

    button {
      padding: 0.6rem 1.2rem; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-accent { background: var(--accent); color: white; }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-outline { background: transparent; border: 1px solid var(--glass-border); color: var(--text-main); }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.05); }

    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }

    .hero {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 2.5rem;
      text-align: center;
      margin-bottom: 2rem;
      backdrop-filter: blur(8px);
    }
    .hero h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
    .hero p { color: var(--text-muted); font-size: 1.1rem; }

    .badge {
      display: inline-block; padding: 0.25rem 0.6rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase;
    }
    .badge-admin { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-user { background: rgba(52, 211, 153, 0.2); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.3); }

    .search-bar { display: flex; gap: 1rem; margin-bottom: 2rem; }
    .search-bar input {
      flex: 1; padding: 0.8rem 1.2rem; border-radius: 10px; border: 1px solid var(--glass-border); background: rgba(15, 23, 42, 0.6); color: white; outline: none;
    }

    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 1.5rem;
      display: flex; flex-direction: column; justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .product-card:hover { transform: translateY(-4px); border-color: rgba(99, 102, 241, 0.4); }
    .product-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }
    .product-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; flex-grow: 1; }
    .product-price { font-size: 1.4rem; font-weight: 700; color: #34d399; margin-bottom: 1rem; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
      display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal {
      background: #1e293b; border: 1px solid var(--glass-border); border-radius: 16px; padding: 2rem; width: 90%; max-width: 450px;
    }
    .modal h2 { margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: var(--text-muted); }
    .form-group input, .form-group textarea {
      width: 100%; padding: 0.7rem; border-radius: 8px; border: 1px solid var(--glass-border); background: #0f172a; color: white; outline: none;
    }

    .toast {
      position: fixed; bottom: 20px; right: 20px; background: #10b981; color: white; padding: 1rem 1.5rem; border-radius: 10px; font-weight: 600; display: none; z-index: 2000; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">⚡ E-Commerce REST API</div>
    <div class="nav-actions">
      <span id="userStatus"></span>
      <button class="btn-outline" id="authBtn" onclick="openAuthModal()">Login / Register</button>
      <button class="btn-primary" onclick="openCartModal()">🛒 Cart (<span id="cartCount">0</span>)</button>
      <button class="btn-accent" id="adminAddBtn" style="display:none;" onclick="openAdminModal()">+ Add Product</button>
    </div>
  </header>

  <div class="container">
    <div class="hero">
      <h1>Node.js E-Commerce Platform</h1>
      <p>JWT Authentication • Cart Management • Inventory Control • Stripe Checkout</p>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search products by title or description..." oninput="fetchProducts()">
    </div>

    <div class="products-grid" id="productsGrid">
      <p style="color: var(--text-muted);">Loading products...</p>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <h2 id="authTitle">Login to Account</h2>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="authEmail" placeholder="admin@ecommerce.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="authPassword" placeholder="••••••••">
      </div>
      <div class="form-group" id="nameGroup" style="display:none;">
        <label>Full Name</label>
        <input type="text" id="authName" placeholder="John Doe">
      </div>
      <div class="form-group" id="roleGroup" style="display:none;">
        <label>Role</label>
        <input type="text" id="authRole" placeholder="user or admin">
      </div>
      <button class="btn-primary" style="width:100%; margin-bottom:0.8rem;" onclick="handleAuthSubmit()">Submit</button>
      <button class="btn-outline" style="width:100%;" onclick="toggleAuthMode()" id="toggleAuthBtn">Need an account? Register</button>
    </div>
  </div>

  <!-- Admin Add Product Modal -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal">
      <h2>+ Create New Product</h2>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="prodTitle" placeholder="e.g. Wireless Headphone">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="prodDesc" rows="3" placeholder="Product details..."></textarea>
      </div>
      <div class="form-group">
        <label>Price (THB)</label>
        <input type="number" id="prodPrice" placeholder="2990">
      </div>
      <div class="form-group">
        <label>Inventory Stock</label>
        <input type="number" id="prodInventory" placeholder="50">
      </div>
      <div class="form-group">
        <label>Category</label>
        <input type="text" id="prodCategory" placeholder="Electronics">
      </div>
      <button class="btn-accent" style="width:100%; margin-bottom:0.8rem;" onclick="handleCreateProduct()">Create Product</button>
      <button class="btn-outline" style="width:100%;" onclick="closeAdminModal()">Cancel</button>
    </div>
  </div>

  <!-- Cart Modal -->
  <div class="modal-overlay" id="cartModal">
    <div class="modal" style="max-width: 600px;">
      <h2>🛒 Shopping Cart</h2>
      <div id="cartItemsList" style="margin-bottom: 1.5rem; max-height: 300px; overflow-y: auto;">
        <p style="color: var(--text-muted);">Cart is empty.</p>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <h3>Total: <span id="cartTotal" style="color:#34d399;">0 THB</span></h3>
        <button class="btn-outline" onclick="clearCart()">Clear Cart</button>
      </div>
      <button class="btn-accent" style="width:100%; margin-bottom:0.8rem;" onclick="handleCheckout()">Checkout & Pay (Stripe)</button>
      <button class="btn-outline" style="width:100%;" onclick="closeCartModal()">Close</button>
    </div>
  </div>

  <div class="toast" id="toast">Message</div>

  <script>
    let isRegisterMode = false;
    let currentUser = null;
    let token = localStorage.getItem('token') || '';

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.background = isError ? '#ef4444' : '#10b981';
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    async function checkAuth() {
      if (!token) {
        updateUserUI(null);
        return;
      }
      try {
        const res = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          const data = await res.json();
          currentUser = data.user;
          updateUserUI(currentUser);
          fetchCart();
        } else {
          localStorage.removeItem('token');
          token = '';
          updateUserUI(null);
        }
      } catch (err) {
        updateUserUI(null);
      }
    }

    function updateUserUI(user) {
      const statusEl = document.getElementById('userStatus');
      const authBtn = document.getElementById('authBtn');
      const adminBtn = document.getElementById('adminAddBtn');

      if (user) {
        statusEl.innerHTML = `Hi, <b>${user.name}</b> <span class="badge badge-${user.role}">${user.role}</span>`;
        authBtn.innerText = 'Logout';
        authBtn.onclick = logout;
        adminBtn.style.display = user.role === 'admin' ? 'inline-block' : 'none';
      } else {
        statusEl.innerText = '';
        authBtn.innerText = 'Login / Register';
        authBtn.onclick = openAuthModal;
        adminBtn.style.display = 'none';
      }
    }

    function logout() {
      localStorage.removeItem('token');
      token = '';
      currentUser = null;
      updateUserUI(null);
      showToast('Logged out');
    }

    function openAuthModal() { document.getElementById('authModal').style.display = 'flex'; }
    function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
    function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
    function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }
    function openCartModal() { document.getElementById('cartModal').style.display = 'flex'; fetchCart(); }
    function closeCartModal() { document.getElementById('cartModal').style.display = 'none'; }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('authTitle').innerText = isRegisterMode ? 'Create New Account' : 'Login to Account';
      document.getElementById('nameGroup').style.display = isRegisterMode ? 'block' : 'none';
      document.getElementById('roleGroup').style.display = isRegisterMode ? 'block' : 'none';
      document.getElementById('toggleAuthBtn').innerText = isRegisterMode ? 'Already have account? Login' : 'Need an account? Register';
    }

    async function handleAuthSubmit() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const endpoint = isRegisterMode ? '/api/auth/register' : '/api/auth/login';

      const payload = { email, password };
      if (isRegisterMode) {
        payload.name = document.getElementById('authName').value;
        payload.role = document.getElementById('authRole').value || 'user';
      }

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (res.ok) {
        token = data.token;
        localStorage.setItem('token', token);
        currentUser = data.user;
        updateUserUI(currentUser);
        closeAuthModal();
        showToast(isRegisterMode ? 'Registered successfully' : 'Logged in');
      } else {
        showToast(data.error || 'Auth failed', true);
      }
    }

    async function fetchProducts() {
      const q = document.getElementById('searchInput').value;
      const res = await fetch(`/api/products?search=${encodeURIComponent(q)}`);
      const data = await res.json();
      const grid = document.getElementById('productsGrid');

      if (!data.data || data.data.length === 0) {
        grid.innerHTML = '<p style="color:var(--text-muted);">No products found.</p>';
        return;
      }

      grid.innerHTML = data.data.map(p => `
        <div class="product-card">
          <div>
            <div class="product-title">${p.title}</div>
            <div class="product-desc">${p.description}</div>
          </div>
          <div>
            <div class="product-price">${p.price.toLocaleString()} THB</div>
            <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:0.8rem;">Stock: ${p.inventory} units</div>
            <button class="btn-primary" style="width:100%;" onclick="addToCart('${p.id}')">🛒 Add to Cart</button>
          </div>
        </div>
      `).join('');
    }

    async function addToCart(productId) {
      if (!token) { showToast('Please login first', true); openAuthModal(); return; }
      const res = await fetch('/api/cart/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ productId, quantity: 1 })
      });
      const data = await res.json();
      if (res.ok) {
        showToast('Added to cart');
        updateCartBadge(data.items);
      } else {
        showToast(data.error, true);
      }
    }

    async function fetchCart() {
      if (!token) return;
      const res = await fetch('/api/cart', { headers: { 'Authorization': `Bearer ${token}` } });
      if (res.ok) {
        const data = await res.json();
        updateCartBadge(data.items);
        renderCartModal(data);
      }
    }

    function updateCartBadge(items = []) {
      const count = items.reduce((acc, i) => acc + i.quantity, 0);
      document.getElementById('cartCount').innerText = count;
    }

    function renderCartModal(data) {
      const list = document.getElementById('cartItemsList');
      document.getElementById('cartTotal').innerText = `${data.totalAmount.toLocaleString()} THB`;

      if (!data.items || data.items.length === 0) {
        list.innerHTML = '<p style="color:var(--text-muted);">Cart is empty.</p>';
        return;
      }

      list.innerHTML = data.items.map(i => `
        <div style="display:flex; justify-content:space-between; align-items:center; background:#0f172a; padding:0.8rem; border-radius:8px; margin-bottom:0.6rem;">
          <div>
            <div style="font-weight:600;">${i.title}</div>
            <div style="font-size:0.85rem; color:var(--text-muted);">${i.price.toLocaleString()} THB x ${i.quantity}</div>
          </div>
          <div style="font-weight:700; color:#34d399;">${i.itemTotal.toLocaleString()} THB</div>
        </div>
      `).join('');
    }

    async function clearCart() {
      if (!token) return;
      await fetch('/api/cart', { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
      fetchCart();
      showToast('Cart cleared');
    }

    async function handleCheckout() {
      if (!token) return;
      const res = await fetch('/api/checkout/create-intent', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, true); return; }

      // Confirm mock payment automatically for demonstration
      const confirmRes = await fetch('/api/checkout/confirm-mock-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ orderId: data.orderId })
      });
      if (confirmRes.ok) {
        showToast('Payment successful! Order paid & stock updated.');
        closeCartModal();
        fetchProducts();
        fetchCart();
      }
    }

    async function handleCreateProduct() {
      const title = document.getElementById('prodTitle').value;
      const description = document.getElementById('prodDesc').value;
      const price = parseFloat(document.getElementById('prodPrice').value);
      const inventory = parseInt(document.getElementById('prodInventory').value);
      const category = document.getElementById('prodCategory').value;

      const res = await fetch('/api/products/admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ title, description, price, inventory, category })
      });
      const data = await res.json();
      if (res.ok) {
        showToast('Product created!');
        closeAdminModal();
        fetchProducts();
      } else {
        showToast(data.error, true);
      }
    }

    checkAuth();
    fetchProducts();
  </script>
</body>
</html>
